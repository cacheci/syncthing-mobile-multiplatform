name: Android Build and Publish

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.deleted == false && github.event.commits[0] != null }}
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select build channel
        id: channel
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            {
              echo "assemble_task=:androidApp:assembleReleaseStable"
              echo "core_task=:androidApp:buildBuiltInSyncthingPreviousStable"
              echo "core_directory=previous"
              echo "core_binary=libsyncthingpreviousnative.so"
              echo "variant=releaseStable"
              echo "title=Stable Release"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "assemble_task=:androidApp:assembleReleaseBeta"
              echo "core_task=:androidApp:buildBuiltInSyncthingRc"
              echo "core_directory=rc"
              echo "core_binary=libsyncthingrcnative.so"
              echo "variant=releaseBeta"
              echo "title=Alpha Preview"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.2
            ndk;28.2.13676358

      - name: Select Android NDK 28.2
        run: |
          ndk_path="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [[ ! -f "$ndk_path/source.properties" ]]; then
            echo "Android NDK 28.2.13676358 was not installed at $ndk_path." >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"

      - name: Calculate Syncthing Core cache fingerprint
        id: syncthing-core-key
        shell: bash
        run: |
          fingerprint="$(
            {
              git -C third_party/syncthing rev-parse HEAD
              sha256sum \
                androidApp/build-syncthing.py \
                androidApp/build.gradle.kts \
                gradle/libs.versions.toml
            } | sha256sum | cut -d ' ' -f 1
          )"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore Syncthing Core
        id: syncthing-core-cache
        uses: actions/cache@v6
        with:
          path: |
            androidApp/build/generated/syncthing/jniLibs
            androidApp/build/generated/syncthing/${{ steps.channel.outputs.core_directory }}/jniLibs
          key: syncthing-core-${{ steps.channel.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.syncthing-core-key.outputs.fingerprint }}

      - name: Cache Go toolchain and build state
        if: steps.syncthing-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            third_party/go
            ~/.cache/go-build
            ~/go/pkg/mod
          key: syncthing-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.syncthing-core-key.outputs.fingerprint }}
          restore-keys: |
            syncthing-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Syncthing Core
        if: steps.syncthing-core-cache.outputs.cache-hit != 'true'
        env:
          CORE_TASK: ${{ steps.channel.outputs.core_task }}
        run: ./gradlew "$CORE_TASK" --stacktrace

      - name: Verify Syncthing Core outputs
        shell: bash
        env:
          CORE_DIRECTORY: ${{ steps.channel.outputs.core_directory }}
          CORE_BINARY: ${{ steps.channel.outputs.core_binary }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for core in \
              "androidApp/build/generated/syncthing/jniLibs/$abi/libsyncthingnative.so" \
              "androidApp/build/generated/syncthing/$CORE_DIRECTORY/jniLibs/$abi/$CORE_BINARY"; do
              if [[ ! -s "$core" ]]; then
                echo "Missing or empty Syncthing Core output: $core" >&2
                exit 1
              fi
            done
          done

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets[github.ref == 'refs/heads/main' && 'ANDROID_KEYSTORE_BASE64' || 'ANDROID_KEYSTORE_BASE64_DBG'] }}
          KEYSTORE_PASS: ${{ secrets[github.ref == 'refs/heads/main' && 'KEYSTORE_PASS' || 'KEYSTORE_PASS_DBG'] }}
          KEY_ALIAS: ${{ secrets[github.ref == 'refs/heads/main' && 'KEY_ALIAS' || 'KEY_ALIAS_DBG'] }}
          KEY_PASSWORD: ${{ secrets[github.ref == 'refs/heads/main' && 'KEY_PASSWORD' || 'KEY_PASSWORD_DBG'] }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASS KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets[github.ref == 'refs/heads/main' && 'KEYSTORE_PASS' || 'KEYSTORE_PASS_DBG'] }}
          KEY_ALIAS: ${{ secrets[github.ref == 'refs/heads/main' && 'KEY_ALIAS' || 'KEY_ALIAS_DBG'] }}
          KEY_PASSWORD: ${{ secrets[github.ref == 'refs/heads/main' && 'KEY_PASSWORD' || 'KEY_PASSWORD_DBG'] }}
          ASSEMBLE_TASK: ${{ steps.channel.outputs.assemble_task }}
        run: >-
          ./gradlew "$ASSEMBLE_TASK"
          -x :androidApp:buildBuiltInSyncthing
          -x :androidApp:buildBuiltInSyncthingPreviousStable
          -x :androidApp:buildBuiltInSyncthingRc
          --stacktrace

      - name: Locate release APK
        id: apk
        env:
          VARIANT: ${{ steps.channel.outputs.variant }}
        run: |
          mapfile -t apks < <(
            find "androidApp/build/outputs/apk/$VARIANT" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | sort
          )

          if (( ${#apks[@]} == 0 )); then
            echo "No APK files found in androidApp/build/outputs/apk/$VARIANT" >&2
            exit 1
          fi

          {
            echo "apk_paths<<EOF"
            printf '%s\n' "${apks[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "apk_names<<EOF"
            for apk in "${apks[@]}"; do
              basename "$apk"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare publication notes
        id: notes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_TITLE: ${{ steps.channel.outputs.title }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          version_code="$(git rev-list --count "$GITHUB_SHA")"
          tag="release-${version_code}-${short_sha}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            baseline_sha="$(
              git describe --tags --match 'release-*' --match 'alpha-preview' \
                --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true
            )"
          else
            baseline_sha="$BEFORE_SHA"
          fi
          if [[ -n "$baseline_sha" ]] && git cat-file -e "${baseline_sha}^{commit}" 2>/dev/null; then
            raw_commit_messages="$(git log "${baseline_sha}..${GITHUB_SHA}" --reverse --format='%s')"
          else
            raw_commit_messages="$(git log -1 "$GITHUB_SHA" --format='%s')"
          fi
          commit_messages="$(
            printf '%s\n' "$raw_commit_messages" \
              | grep -Eiv '^(chore|wkfl|deps)' \
              | sed 's/^/- /' \
              || true
          )"
          {
            printf 'Automated %s build for commit %s.\n\n' "$BUILD_TITLE" "$GITHUB_SHA"
            printf '%s\n' "$commit_messages"
          } > "$RUNNER_TEMP/release-notes.md"
          commit_messages_b64="$(printf '%s' "$commit_messages" | base64 -w 0)"
          echo "commit_messages_b64=$commit_messages_b64" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish immutable Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATHS: ${{ steps.apk.outputs.apk_paths }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          mapfile -t apk_paths <<< "$APK_PATHS"

          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to another commit; refusing to move it." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published; leaving its tag and assets unchanged."
              exit 0
            fi
          else
            gh release create "$tag" \
              --verify-tag \
              --title "Stable Release ${GITHUB_SHA:0:12}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft
          fi

          # Replacing assets is permitted only while this release is a draft.
          gh release upload "$tag" "${apk_paths[@]}" --clobber
          assets="$(gh release view "$tag" --json assets --jq '.assets')"
          for apk_path in "${apk_paths[@]}"; do
            apk_name="$(basename "$apk_path")"
            apk_size="$(stat -c '%s' "$apk_path")"
            if ! jq -e --arg name "$apk_name" --argjson size "$apk_size" \
              'any(.[]; .name == $name and .size == $size)' >/dev/null <<< "$assets"; then
              echo "Release asset missing or incomplete: $apk_name" >&2
              exit 1
            fi
          done

          gh release edit "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft=false \
            --prerelease=false \
            --latest

      - name: Upload APK to Telegram
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && steps.notes.outcome == 'success' }}
        env:
          APK_PATHS: ${{ steps.apk.outputs.apk_paths }}
          COMMIT_MESSAGES_B64: ${{ steps.notes.outputs.commit_messages_b64 }}
          BUILD_TITLE: ${{ steps.channel.outputs.title }}
          TELEGRAM_BOT_API: ${{ secrets.TELEGRAM_BOT_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REPLY_TO_MESSAGE_ID: ${{ secrets.TELEGRAM_REPLY_TO_MESSAGE_ID }}
        run: |
          missing=()
          for name in TELEGRAM_BOT_API TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_REPLY_TO_MESSAGE_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          TELEGRAM_BOT_API="${TELEGRAM_BOT_API%/}"
          if [[ ! "$TELEGRAM_BOT_API" =~ ^https?://[^[:space:]]+/bot$ ]]; then
            echo "TELEGRAM_BOT_API must use the format https://example.com/bot." >&2
            exit 1
          fi

          if [[ ! "$TELEGRAM_REPLY_TO_MESSAGE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TELEGRAM_REPLY_TO_MESSAGE_ID must be a positive integer." >&2
            exit 1
          fi

          mapfile -t apk_paths <<< "$APK_PATHS"

          eligible_apks=()
          for apk_path in "${apk_paths[@]}"; do
            if [[ ! -f "$apk_path" ]]; then
              echo "APK file does not exist: $apk_path" >&2
              exit 1
            fi

            size="$(stat -c '%s' "$apk_path")"
            if (( size > 2000*1024*1024 )); then
              echo "::warning file=$apk_path::Skipping APK larger than Telegram's 2000 MB upload limit."
              continue
            fi
            eligible_apks+=("$apk_path")
          done

          apk_count="${#eligible_apks[@]}"
          if (( apk_count == 0 )); then
            echo "No APK files are eligible for Telegram upload." >&2
            exit 1
          fi
          if (( apk_count > 10 )); then
            echo "Telegram media groups support at most 10 files; found $apk_count." >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:12}"
          reply_parameters="$(
            jq -cn \
              --argjson message_id "$TELEGRAM_REPLY_TO_MESSAGE_ID" \
              '{message_id: $message_id}'
          )"
          commit_messages="$(printf '%s' "$COMMIT_MESSAGES_B64" | base64 --decode)"
          caption_prefix="$BUILD_TITLE $short_sha

          Changes
          "
          warning=""
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            warning="⚠️ Please note that the preview release is unstable and is signed with the AOSP test key. Since the test key is publicly available, anyone can generate and sign an APK with the same key, and such APKs may be installed without triggering a signature-related warning."
          fi
          caption_suffix=$'\n\n'"$warning"

          max_caption_length=1000
          max_commit_length=$((
            max_caption_length - ${#caption_prefix} - ${#caption_suffix}
          ))
          truncation_marker=$'\n… (additional commits omitted)'
          if (( ${#commit_messages} > max_commit_length )); then
            truncated_length=$((max_commit_length - ${#truncation_marker}))
            commit_messages="${commit_messages:0:truncated_length}${truncation_marker}"
          fi

          escape_markdown_v2() {
            sed \
              -e 's/\\/\\\\/g' \
              -e 's/[][()~`>#+=|{}.!_*-]/\\&/g'
          }

          escaped_commit_messages="$(
            printf '%s' "$commit_messages" | escape_markdown_v2
          )"
          escaped_warning="$(
            printf '%s' "$warning" | escape_markdown_v2
          )"
          telegram_caption="*$BUILD_TITLE* \`$short_sha\`

          *Changes*
          $escaped_commit_messages

          $escaped_warning"

          verify_telegram_response() {
            local response="$1"
            if ! jq -e '.ok == true' >/dev/null <<< "$response"; then
              echo "Telegram API returned an unsuccessful response: $response" >&2
              return 1
            fi
          }

          if (( apk_count == 1 )); then
            response="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --retry 3 \
                --form-string "chat_id=$TELEGRAM_CHAT_ID" \
                --form "document=@${eligible_apks[0]}" \
                --form-string "caption=$telegram_caption" \
                --form-string "parse_mode=MarkdownV2" \
                --form-string "reply_parameters=$reply_parameters" \
                "${TELEGRAM_BOT_API}${TELEGRAM_BOT_TOKEN}/sendDocument"
            )"
          else
            args=(
              --silent
              --show-error
              --fail-with-body
              --retry 3
              --form-string "chat_id=$TELEGRAM_CHAT_ID"
              --form-string "reply_parameters=$reply_parameters"
            )

            media_json='['
            for (( i=0; i<apk_count; i++ )); do
              apk_path="${eligible_apks[$i]}"
              args+=(--form "file$i=@$apk_path")
              if (( i == 0 )); then
                media_json+="{\"type\":\"document\",\"media\":\"attach://file$i\",\"caption\":$(printf '%s' "$telegram_caption" | jq -Rs .),\"parse_mode\":\"MarkdownV2\"},"
              else
                media_json+="{\"type\":\"document\",\"media\":\"attach://file$i\"},"
              fi
            done

            media_json="${media_json%,}]"
            args+=(--form-string "media=$media_json")
            response="$(
              curl \
                "${args[@]}" \
                "${TELEGRAM_BOT_API}${TELEGRAM_BOT_TOKEN}/sendMediaGroup"
            )"
          fi

          verify_telegram_response "$response"
